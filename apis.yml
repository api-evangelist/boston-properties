description: >-
  BXP (formerly Boston Properties) is the largest publicly traded developer, owner,
  and manager of premier workplaces in the United States. The company develops,
  owns, and manages Class A office properties across six major U.S. markets: Boston,
  Los Angeles, New York, San Francisco, Seattle, and Washington DC. BXP is a
  self-administered and self-managed REIT focused on premier urban workspace.
apis:
  - aid: boston-properties:bxp-wordpress-rest-api
    name: BXP WordPress REST API
    description: >-
      The WordPress REST API served by BXP's corporate website at https://www.bxp.com/wp-json — 332
      routes across 15 namespaces, discovered by probing the API host root on 2026-09-04. This is
      the only machine-readable contract BXP publishes. It is incidental CMS infrastructure, not a
      product: BXP runs no developer program, publishes no documentation, no SDKs, no pricing and
      no terms for programmatic use, and the surface carries x-robots-tag noindex. Reads under
      wp/v2 are anonymous and were verified live (pages, posts, types, categories, search,
      gl_js_maps, and an oEmbed 1.0 provider endpoint); writes and privileged reads require a
      WordPress account on BXP's own site and are not obtainable by a third party. The entities a
      real-estate consumer would want — property, region, team-member, property-type, member-type
      — exist on the site as custom post types with their own sitemaps but are deliberately NOT
      registered for REST, so they are absent from this contract.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/boston-properties.png
    humanURL: https://www.bxp.com/wp-json/
    baseURL: https://www.bxp.com/wp-json
    tags:
      - WordPress
      - Content
      - CMS
      - Real-Estate
    properties:

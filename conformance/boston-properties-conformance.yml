domain_standards:
  market: commercial real estate / REIT
  applicable_standard_found: false
  probed:
  - standard: RESO Data Dictionary / RESO Web API
    present: false
    note: >-
      RESO is the machine-readable standard for real-estate listing data, but it governs
      residential MLS distribution; BXP is a commercial office REIT and declares no RESO
      conformance anywhere on bxp.com. The one contract it serves is a WordPress CMS API with no
      property, lease or listing entity in it at all — /wp/v2/types lists only WordPress core
      types plus a map plugin (gl_js_maps). Property, region and team-member content exists as
      custom post types (visible in the sitemaps) but is deliberately not exposed to REST.
  - standard: OSCRE / gbXML / BOMA data standards
    present: false
    note: No reference on bxp.com and no matching structure in the served contract.
  reward_only_note: >-
    The Kin Score treats domain_standard_conformance as reward-only. BXP's market has standards,
    but BXP publishes no contract in that market, so there is nothing to conform. No conformance
    is invented to fill the slot.
